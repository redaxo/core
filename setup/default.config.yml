setup: true
live_mode: false
safe_mode: false
debug:
    enabled: false
    throw_always_exception: false # `true` for all error levels, `[E_WARNING, E_NOTICE]` for subset
instname: null
server: https://www.redaxo.org/
servername: REDAXO
error_email: null
fileperm: '0664'
dirperm: '0775'
session_duration: 7200
session_keep_alive: 21600
session_max_overall_duration: 2419200 # 4 weeks
session_warning_time: 300
backend_login_policy:
    login_tries_until_blocked: 50
    login_tries_until_delay: 3
    relogin_delay: 5
    enable_stay_logged_in: true
# using separate cookie domains for frontend and backend is more secure,
# but be warned that some features like detecting a backend user in the frontend
# will no longer work.
session:
    backend:
        # save_path:
        cookie:
            lifetime: null
            path: null
            domain: null
            secure: null
            httponly: true
            samesite: 'Lax'
    frontend:
        # save_path:
        cookie:
            lifetime: null
            path: null
            domain: null
            secure: null
            httponly: true
            samesite: 'Lax'
password_policy:
    length: {min: 8, max: 4096}
    lowercase: {min: 0}
    uppercase: {min: 0}
    digit: {min: 0}
    # no_reuse_of_last: 6
    # format analog https://www.php.net/manual/de/dateinterval.construct.php
    # no_reuse_within: P6W
    # force_renew_after: P6W
    # block_account_after: P3M
lang: en_gb
lang_fallback: [en_gb, de_de]
use_https: false
use_hsts: false
hsts_max_age: 31536000 # 1 year
use_gzip: false
use_etag: true
start_page: structure
timezone: Europe/Berlin
http_client_proxy: null
setup_addons: []
table_prefix: rex_
temp_prefix: tmp_
db:
    1:
        host: localhost
        login: root
        password: ''
        name: redaxo6
        persistent: false
        ssl_key: null
        ssl_cert: null
        ssl_ca: null
        ssl_verify_server_cert: true
    2:
        host: ''
        login: ''
        password: ''
        name: ''
        persistent: false
        ssl_key: null
        ssl_cert: null
        ssl_ca: null
        ssl_verify_server_cert: true
use_accesskeys: true
accesskeys:
    save: s
    apply: x
    delete: d
    add: a
    add_2: y
editor: null
editor_basepath: null
theme: null
blocked_extensions: [asp, aspx, bat, cfm, cgi, flv, hh, html, htaccess, htpasswd, ini, jsp, jsf, js, jsphp, log, mjs, pht, php, php3, php4, php5, php6, php7, php8, phar, pl, ps1, phtml, py, rb, rm, sh, shmtl, shtml, swf, wasm, wmv, wma, xhtml, xht, xml]
allowed_mime_types:
    avif: [image/avif]
    gif: [image/gif]
    jpg: [image/jpeg, image/pjpeg]
    jpeg: [image/jpeg, image/pjpeg]
    png: [image/png]
    webp: [image/webp]
    eps: [application/postscript]
    tif: [image/tiff]
    tiff: [image/tiff]
    svg: [image/svg+xml]
    pdf: [application/pdf]
    xls: [application/vnd.ms-excel, application/octet-stream, application/encrypted]
    xlsx: [application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/octet-stream, application/encrypted]
    doc: [application/msword, application/octet-stream, application/encrypted]
    docx: [application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/octet-stream, application/encrypted]
    dot: [application/msword, application/octet-stream, application/encrypted]
    dotx: [application/vnd.openxmlformats-officedocument.wordprocessingml.template, application/octet-stream, application/encrypted]
    ppt: [application/vnd.ms-powerpoint]
    pptx: [application/vnd.openxmlformats-officedocument.presentationml.presentation]
    pot: [application/vnd.ms-powerpoint]
    potx: [application/vnd.openxmlformats-officedocument.presentationml.template]
    pps: [application/vnd.ms-powerpoint]
    ppsx: [application/vnd.openxmlformats-officedocument.presentationml.slideshow]
    rtf: [application/rtf]
    txt: [text/plain, application/octet-stream]
    md: [text/markdown]
    csv: [text/csv, application/octet-stream]
    ics: [text/calendar]
    vcf: [text/vcard]
    srt: [text/plain]
    vtt: [text/vtt]
    zip: [application/x-zip-compressed, application/zip]
    gz: [application/x-gzip]
    tar: [application/x-tar]
    mov: [video/quicktime]
    movie: [video/quicktime]
    mp3: [audio/mpeg]
    mpe: [video/mpeg]
    mpeg: [video/mpeg]
    mpg: [video/mpeg]
    mp4: [video/mp4]
image_extensions: [avif, bmp, gif, jpeg, jpg, png, svg, tif, tiff, webp]
sanitize_svgs: true
